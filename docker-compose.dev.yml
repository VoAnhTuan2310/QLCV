# ==========================================
# Fullstack App - Development Docker Compose
# ==========================================
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fullstack_postgres_dev
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: dev_fullstack_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - dev_network

volumes:
  postgres_dev_data:

networks:
  dev_network:
    driver: bridge
