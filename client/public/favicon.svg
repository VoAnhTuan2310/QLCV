<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="128" fill="#090d16" />
  <rect width="472" height="472" x="20" y="20" rx="118" fill="url(#bg)" opacity="0.15" />
  <rect width="512" height="512" rx="128" fill="none" stroke="url(#bg)" stroke-width="12" opacity="0.4" />
  
  <!-- Glowing Center Icon (Sparkles & Flow Wave) -->
  <g filter="url(#glow)">
    <path d="M256 110 L280 216 L386 240 L280 264 L256 370 L232 264 L126 240 L232 216 Z" fill="url(#bg)" />
    <circle cx="370" cy="140" r="24" fill="#38bdf8" />
    <circle cx="145" cy="340" r="18" fill="#f43f5e" />
  </g>
</svg>
